# Database Connection Configuration
# NOTE: Update the username and password below to match your local MySQL Server settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ashish@5819}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration Security Properties
# Must be at least 256 bits (32 bytes) hex-encoded secret key
blog.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
blog.app.jwtExpirationMs=86400000

# File Upload Limit (optional, good for custom banners, etc.)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
